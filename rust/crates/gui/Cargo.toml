[package]
name = "realhires-gui"
description = "Universal Music Player: a music player that finds fake hi-res and fake lossless audio files."
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "universal-music-player"
path = "src/main.rs"

[dependencies]
realhires-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "wayland", "x11", "glow"] }
# only to switch on winit's default features (dlopen for Wayland), which eframe's glow setup leaves off
winit = "0.30.13"
egui = "0.37"
egui_extras = "0.37"
rfd = "0.18"
# audio output for the player (2.0): WASAPI, CoreAudio, ALSA
cpal = "0.18.2"
# local dates of the play history (already used by the core)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# the installed font families, for Settings → Appearance (already used by eframe's system fonts)
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# 2.3: Search Cover Online and the Properties window's Search buttons open the browser (as egui's own
# links do), and the window watches the system clipboard; both crates are already used by eframe/egui-winit
webbrowser = "1.2.7"
arboard = { version = "3.7.0", default-features = false }

# bit-perfect playback on Windows (2.1): a WASAPI exclusive-mode output beside cpal (whose WASAPI is shared-mode
# only), with the windows crate cpal already uses
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_Properties",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
