[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "2.1.0"
license = "GPL-3.0-only"
repository = "https://github.com/SU2H1/Universal-Music-Player"
edition = "2021"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
